
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web tìm kiếm nhà trọ</title>
    <link rel="icon" href="assets/icon-nhatro.jpeg">


    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    />
</head>

<body>

    <!-- =========================
         SEARCH BAR
    ========================== -->

    <div class="search-area">

        <input
            type="text"
            id="searchBox"
            placeholder="Nhập địa danh (VD: Hồ Gươm, Cầu Giấy...)"
            autocomplete="off"
        >

        <button
            id="locateBtn"
            title="Lấy vị trí hiện tại"
        >
            📍
        </button>

    </div>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div id="sidebar">

    <!-- =========================
         BỘ LỌC
    ========================== -->

    <div class="filterBox">

        <h3>🔍 Bộ lọc tìm nhà trọ</h3>

        <label for="maxPrice">
            Giá tối đa (VND)
        </label>

        <input
            type="number"
            id="maxPrice"
            value="5000000"
            min="0"
            placeholder="Ví dụ: 5000000"
        >

        <label for="minArea">
            Diện tích tối thiểu (m²)
        </label>

        <input
            type="number"
            id="minArea"
            value="20"
            min="0"
            placeholder="Ví dụ: 20"
        >

        <label for="minPeople">
            Số người tối thiểu
        </label>

        <input
            type="number"
            id="minPeople"
            value="1"
            min="1"
            placeholder="Ví dụ: 2"
        >

        <button id="filterBtn">
            Áp dụng bộ lọc
        </button>

    </div>

    <!-- =========================
         DANH SÁCH NHÀ TRỌ
    ========================== -->

    <div class="listBox">

        <h3>📋 Danh sách nhà trọ</h3>

        <input
            type="text"
            id="searchName"
            placeholder="🔍 Tìm theo tên nhà trọ..."
        >

        <div class="hint">
            Chọn vị trí trên bản đồ hoặc sử dụng thanh tìm kiếm để tìm nhà trọ gần khu vực mong muốn.
        </div>

        <div id="list">

            <!-- Danh sách sẽ được render bằng JavaScript -->

        </div>

    </div>

</div>

    <!-- =========================
         MAP
    ========================== -->

    <div
        id="map"
        aria-label="Bản đồ tìm nhà trọ"
    ></div>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!-- Leaflet -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Main JS -->
    <script
        type="module"
        src="js/main.js">
    </script>

</body>
</html>
